name: Update release metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    # The generated commit contains [skip ci], so it cannot trigger a loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate updates.json
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/update_updates.py

      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update release metadata [skip ci]"
          git push
